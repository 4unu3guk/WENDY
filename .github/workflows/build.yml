name: Build WENDY

on:
  push:
    branches:
      - master
      - architecture/core-foundation
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WENDY/WENDY.csproj

      - name: Build
        run: dotnet build WENDY/WENDY.csproj --configuration Release --no-restore
